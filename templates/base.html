{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Member Outreach Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav id="sidebar" class="sidebar d-flex flex-column flex-shrink-0 p-3 text-white">
            <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
                <i class="bi bi-heart-pulse me-2 fs-4"></i>
                <span class="fs-5 fw-semibold">Outreach Portal</span>
            </a>
            <hr>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="/" class="nav-link text-white {% block nav_dashboard %}{% endblock %}">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                </li>
                <li>
                    <a href="/members/" class="nav-link text-white {% block nav_members %}{% endblock %}">
                        <i class="bi bi-people me-2"></i>Members
                    </a>
                </li>
                <li>
                    <a href="/api/members/appointments/" class="nav-link text-white {% block nav_appointments %}{% endblock %}">
                        <i class="bi bi-calendar-check me-2"></i>Appointments
                    </a>
                </li>
                <li>
                    <a href="/api/predictions/high-risk/" class="nav-link text-white {% block nav_highrisk %}{% endblock %}">
                        <i class="bi bi-exclamation-triangle me-2"></i>High Risk
                    </a>
                </li>
                <li>
                    <a href="/api/analytics/overview/" class="nav-link text-white {% block nav_analytics %}{% endblock %}">
                        <i class="bi bi-graph-up me-2"></i>Analytics
                    </a>
                </li>
            </ul>
            <hr>
            <div class="text-muted small">
                <i class="bi bi-info-circle me-1"></i>
                Member Outreach Portal v1.0
            </div>
        </nav>

        <!-- Main content -->
        <main class="main-content flex-grow-1">
            <div class="container-fluid p-4">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
